notes: |
  Reconstructed ancestor of Na-Dene (Tlingit plus Athabaskan–Eyak). The dating
  is highly uncertain. Vajda's Dene–Yeniseian proposal (2008), which links it to
  Ket in Siberia, is widely discussed but not universally accepted.
