notes: |
  Standard (Lhasa) Tibetan, the prestige variety since the 17th c. Spoken
  varieties descend from Old Tibetan; Classical Tibetan as parent is a
  simplification reflecting the shared literary standard. Amdo and Khams
  are divergent sister varieties.
