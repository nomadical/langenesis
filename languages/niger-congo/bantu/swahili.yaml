notes: |
  Bantu language of the East African coast, with substantial Arabic-derived
  vocabulary from centuries of Indian Ocean trade. Lingua franca across East
  Africa; speaker count includes both L1 and L2. Northeast Coast Bantu (Sabaki,
  Guthrie G42); written in Arabic script (Ajami) from at least the 18th century.
