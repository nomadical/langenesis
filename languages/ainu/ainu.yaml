notes: |
  Isolate of Hokkaido (formerly also Sakhalin and the Kurils). Nearly extinct
  as a first language — only a handful of elderly speakers — with active
  revival efforts; recognised by Japan's 2019 Ainu Promotion Act. Start date
  (Satsumon period) is approximate.
