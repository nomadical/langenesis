id: proto-northwest-semitic
name: Proto-Northwest Semitic
parents: [proto-central-semitic]
period:
  start: -2000
  end: -1200
  start_uncertainty: 500
status: reconstructed
sources:
  - https://en.wikipedia.org/wiki/Northwest_Semitic_languages
notes: |
  Reconstructed ancestor of Ugaritic, the Canaanite languages (Hebrew,
  Phoenician, Moabite) and Aramaic. Whether Ugaritic is Canaanite or a
  separate branch is debated.
