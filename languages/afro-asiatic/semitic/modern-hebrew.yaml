id: modern-hebrew
name: Modern Hebrew
glottocode: hebr1245
iso639_3: heb
parents: [medieval-hebrew]
period:
  start: 1880
  end: present
status: living
speakers: 9000000
sources:
  - https://en.wikipedia.org/wiki/Modern_Hebrew
  - https://glottolog.org/resource/languoid/id/hebr1245
notes: |
  Revived as a spoken language in the late 19th and early 20th century, led by
  Eliezer Ben-Yehuda, drawing on Biblical, Mishnaic and Medieval Hebrew. Parent
  is the written Medieval Hebrew tradition; there were no native speakers
  between roughly 200 CE and the revival.
