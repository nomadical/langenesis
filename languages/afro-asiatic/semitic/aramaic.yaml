id: aramaic
name: Imperial and Middle Aramaic
parents: [old-aramaic]
period:
  start: -700
  end: 700
status: classical
sources:
  - https://en.wikipedia.org/wiki/Aramaic
notes: |
  Covers Imperial Aramaic (lingua franca of the Neo-Assyrian and Achaemenid
  empires) and Middle/Late Aramaic (Biblical, Jewish Palestinian, Jewish
  Babylonian, Nabataean, Palmyrene). Old Aramaic, Classical Syriac and the
  Neo-Aramaic languages are tracked as separate nodes.
