id: proto-berber
name: Proto-Berber
parents: [proto-afro-asiatic]
period:
  start: -1000
  end: 0
  start_uncertainty: 1000
  end_uncertainty: 500
status: reconstructed
sources:
  - https://en.wikipedia.org/wiki/Proto-Berber_language
notes: |
  Reconstructed ancestor of the Berber languages. The modern languages are
  quite close to one another, suggesting a common ancestor only c. 2000–3000
  years ago, though the Berber branch itself split from Afro-Asiatic much
  earlier. Libyco-Berber inscriptions are not tracked here.
