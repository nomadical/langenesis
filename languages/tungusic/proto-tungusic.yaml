id: proto-tungusic
name: Proto-Tungusic
parents: []
period:
  start: 0
  end: 800
  start_uncertainty: 500
  end_uncertainty: 300
status: reconstructed
sources:
  - https://en.wikipedia.org/wiki/Tungusic_languages
notes: |
  Reconstructed ancestor of the Tungusic languages, probably in the middle
  Amur basin. Dating is uncertain (from ~500 BCE to ~500 CE); links to
  Mongolic and Turkic ("Altaic") remain contested.
