notes: |
  Ancestor of the Khoe languages and extinct Kwadi (Angola). "Khoisan" is an
  areal-typological label for click languages, not a demonstrated family;
  Khoe-Kwadi, Kx'a and Tuu are modelled separately. Khoe-Kwadi may have
  arrived in southern Africa with pastoralists from East Africa.
