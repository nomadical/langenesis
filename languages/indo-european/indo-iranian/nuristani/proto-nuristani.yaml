id: proto-nuristani
name: Proto-Nuristani
parents: [proto-indo-iranian]
period:
  start: -1800
  end: -500
  start_uncertainty: 500
status: reconstructed
sources:
  - https://en.wikipedia.org/wiki/Nuristani_languages
notes: |
  Ancestor of the Nuristani languages of northeastern Afghanistan, treated as a
  third Indo-Iranian branch beside Indo-Aryan and Iranian (following Morgenstierne
  and Strand). Dating very uncertain.
