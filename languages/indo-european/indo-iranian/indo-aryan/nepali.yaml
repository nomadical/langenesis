notes: |
  Eastern Pahari (Northern Indo-Aryan), from the Khas language of western Nepal;
  earliest inscriptions c. 13th c. Its Middle Indo-Aryan ancestry is debated;
  parented here to Western Apabhraṃśa as a simplification.
