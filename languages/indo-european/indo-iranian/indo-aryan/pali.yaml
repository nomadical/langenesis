notes: |
  Middle Indo-Aryan literary language of the Theravāda Buddhist canon. Its exact
  dialectal base is disputed (often linked to western rather than Magadhi Prakrit).
  Still used liturgically and scholastically in Sri Lanka and Southeast Asia.
