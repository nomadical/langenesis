id: proto-eskimo-aleut
name: Proto-Eskimo-Aleut
parents: []
period:
  start: -4000
  end: -2000
  start_uncertainty: 1000
  end_uncertainty: 500
status: reconstructed
sources:
  - https://en.wikipedia.org/wiki/Eskimo%E2%80%93Aleut_languages
notes: |
  Reconstructed ancestor of Eskimo–Aleut, probably spoken around the Bering
  Strait. The Aleut–Eskimo split is estimated at about 4000 years ago. Links to
  Uralic or Chukotko-Kamchatkan have been proposed but not demonstrated.
