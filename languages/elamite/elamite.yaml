notes: |
  Language of Elam in southwestern Iran, attested from ~2600 BCE to the
  Achaemenid period (Old, Middle, Neo-, Achaemenid Elamite). Usually treated
  as an isolate; the Elamo-Dravidian hypothesis is not accepted. Whether
  Proto-Elamite and Linear Elamite record the same language is debated.
